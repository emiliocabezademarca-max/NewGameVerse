    const BubbleCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, radius: 180 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const numBubbles = Math.min(Math.floor(width / 20), 55);
        const bubbles = [];

        class Bubble {
          constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.radius = Math.random() * 28 + 8;
            this.vx = (Math.random() - 0.5) * 0.7;
            this.vy = (Math.random() - 0.5) * 0.7;
            this.baseAlpha = Math.random() * 0.4 + 0.25;
            const colorChoice = Math.random();
            this.color = colorChoice > 0.5 ? '168, 85, 247' : colorChoice > 0.25 ? '192, 132, 252' : '255, 255, 255';
            this.pulse = Math.random() * Math.PI * 2;
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < -this.radius) this.x = width + this.radius;
            if (this.x > width + this.radius) this.x = -this.radius;
            if (this.y < -this.radius) this.y = height + this.radius;
            if (this.y > height + this.radius) this.y = -this.radius;

            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < mouse.radius) {
              const force = (mouse.radius - distance) / mouse.radius;
              this.x -= (dx / distance) * force * 3;
              this.y -= (dy / distance) * force * 3;
            }
            this.pulse += 0.03;
          }

          draw() {
            ctx.beginPath();
            const currentRadius = Math.max(2, this.radius + Math.sin(this.pulse) * 2.5);
            const gradient = ctx.createRadialGradient(
              this.x - currentRadius * 0.3, this.y - currentRadius * 0.3, currentRadius * 0.1,
              this.x, this.y, currentRadius
            );
            gradient.addColorStop(0, `rgba(255, 255, 255, ${this.baseAlpha + 0.35})`);
            gradient.addColorStop(0.6, `rgba(${this.color}, ${this.baseAlpha})`);
            gradient.addColorStop(1, `rgba(${this.color}, 0)`);
            ctx.fillStyle = gradient;
            ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.baseAlpha * 0.6})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        for (let i = 0; i < numBubbles; i++) bubbles.push(new Bubble());

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < bubbles.length; i++) {
            for (let j = i + 1; j < bubbles.length; j++) {
              const dx = bubbles[i].x - bubbles[j].x;
              const dy = bubbles[i].y - bubbles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(bubbles[i].x, bubbles[i].y);
                ctx.lineTo(bubbles[j].x, bubbles[j].y);
                ctx.strokeStyle = `rgba(192, 132, 252, ${0.18 * (1 - dist / 120)})`;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }

          bubbles.forEach((b) => { b.update(); b.draw(); });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-80" />;
    };

    const INITIAL_MEDIA_SETTINGS = {
      videoTitle: 'Trailer Oficial de Temporada - NewGameVerse 2026',
      videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0',
      discordUrl: 'https://discord.gg',
      instagramUrl: 'https://instagram.com',
      tiktokUrl: 'https://tiktok.com'
    };

    const INITIAL_HERO = [
      {
        id: 'hero-1',
        title: 'Aetheria Legends: Actualización "Reino de Éter"',
        category: 'Súper Update',
        game: 'Aetheria Legends',
        date: 'Hace 1 hora',
        image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80',

    const INITIAL_BETAS = [{ id: 'ba-1', title: 'Valiant Realms: Rebirth', type: 'Beta Abierta', description: 'MMORPG de fantasía medieval.' }];
    const INITIAL_CHARACTERS = [{ id: 'c-1', name: 'Lyra Vance', game: 'Aetheria Legends', avatar: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80', lore: 'Capaz de alterar su densidad molecular.' }];
    const INITIAL_UPDATES = [{ id: 'u-1', game: 'Aetheria Legends', version: 'v4.0.2', title: 'Parche de Rebalanceo', items: 'Reducción de enfriamiento de habilidades.' }];
    const INITIAL_BUGS = [{ id: 'b-1', game: 'Vortex Protocol', bug: 'Vuelo Infinito', fix: 'Validación en servidor.' }];
    const INITIAL_CURIOSITIES = [{ id: 'cur-1', icon: '🎵', title: 'Canción Oculta', game: 'Cyber-Chrono 2088', detail: 'Versión retro en pausa.' }];
    const INITIAL_ADMIN_USERS = [{ id: 'usr-1', username: 'OsitoP3k', password: 'Emi1307', role: 'Super Administrador' }];

    function App() {
      const [activeTab, setActiveTab] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [heroIdx, setHeroIdx] = useState(0);

      const [isAdmin, setIsAdmin] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showUserMgmtModal, setShowUserMgmtModal] = useState(false);
      const [showMediaSettingsModal, setShowMediaSettingsModal] = useState(false);
      
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [toast, setToast] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      const [adminUsers, setAdminUsers] = useState(INITIAL_ADMIN_USERS);
      const [mediaSettings, setMediaSettings] = useState(INITIAL_MEDIA_SETTINGS);
      const [heroData, setHeroData] = useState(INITIAL_HERO);
      const [updatesData, setUpdatesData] = useState(INITIAL_UPDATES);
      const [betasData, setBetasData] = useState(INITIAL_BETAS);
      const [charactersData, setCharactersData] = useState(INITIAL_CHARACTERS);
      const [bugsData, setBugsData] = useState(INITIAL_BUGS);
      const [curiositiesData, setCuriositiesData] = useState(INITIAL_CURIOSITIES);

      const [userEditModal, setUserEditModal] = useState(null);
      const [userFormData, setUserFormData] = useState({ username: '', password: '', role: 'Editor de Contenido' });
      const [editorModal, setEditorModal] = useState(null);
      const [formData, setFormData] = useState({});

      const fetchCloudData = async () => {
        setIsSyncing(true);
        try {
          const { data, error } = await supabaseClient.from('app_data').select('*');
          if (error) {
            console.error("Error Supabase:", error);
            return;
          }
          if (data && data.length > 0) {
            data.forEach(row => {
              if (row.key === 'ngv_u' && row.payload) setAdminUsers(row.payload);
              if (row.key === 'ngv_m' && row.payload) setMediaSettings(row.payload);
              if (row.key === 'ngv_h' && row.payload) setHeroData(row.payload);
              if (row.key === 'ngv_up' && row.payload) setUpdatesData(row.payload);
              if (row.key === 'ngv_b' && row.payload) setBetasData(row.payload);
              if (row.key === 'ngv_c' && row.payload) setCharactersData(row.payload);
              if (row.key === 'ngv_bg' && row.payload) setBugsData(row.payload);
              if (row.key === 'ngv_cu' && row.payload) setCuriositiesData(row.payload);
            });
            showToast('¡Sincronizado con la nube!');
          } else {
            // Sembramos los datos iniciales de forma silenciosa
            await persistData('ngv_u', INITIAL_ADMIN_USERS, false);
            await persistData('ngv_m', INITIAL_MEDIA_SETTINGS, false);
            await persistData('ngv_h', INITIAL_HERO, false);
            await persistData('ngv_up', INITIAL_UPDATES, false);
            await persistData('ngv_b', INITIAL_BETAS, false);
            await persistData('ngv_c', INITIAL_CHARACTERS, false);
            await persistData('ngv_bg', INITIAL_BUGS, false);
            await persistData('ngv_cu', INITIAL_CURIOSITIES, false);
            showToast('¡Base de datos inicializada!');
          }
        } catch (e) {
          console.error("Excepción:", e);
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
      }, []);

      const persistData = async (key, payloadData, showNotification = true) => {
        try {
          const { error } = await supabaseClient
            .from('app_data')
            .upsert({ 
              key: key, 
              payload: payloadData, 
              updated_at: new Date().toISOString() 
            }, { onConflict: 'key' });

          if (error) {
            console.error("Error al guardar en Supabase:", error);
            if (showNotification) showToast('Error al guardar en la nube', 'info');
          } else {
            if (showNotification) showToast('¡Guardado y sincronizado en la nube!');
          }
        } catch (err) {
          console.warn("Cloud save exception:", err);
        }
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        if (heroData.length === 0) return;
        const timer = setInterval(() => {
          setHeroIdx((prev) => (prev + 1) % heroData.length);
        }, 6000);
        return () => clearInterval(timer);
      }, [heroData.length]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const foundUser = adminUsers.find(
          (u) => u.username.trim() === loginUsername.trim() && u.password === loginPassword
        );

        if (foundUser) {
          setIsAdmin(true);
          setCurrentUser(foundUser);
          setShowLoginModal(false);
          setLoginUsername('');
          setLoginPassword('');
          setAuthError('');
          showToast(`¡Bienvenido/a ${foundUser.username}!`);
        } else {
          setAuthError('Usuario o contraseña incorrectos');
        }
      };

      const handleSaveUser = (e) => {
        e.preventDefault();
        if (!userFormData.username.trim() || !userFormData.password.trim()) {
          showToast('Usuario y contraseña requeridos', 'info');
          return;
        }

        let updatedUsers;
        if (typeof userEditModal === 'object' && userEditModal !== null) {
          updatedUsers = adminUsers.map((u) =>
            u.id === userEditModal.id
              ? { ...u, username: userFormData.username.trim(), password: userFormData.password, role: userFormData.role }
              : u
          );
        } else {
          const exists = adminUsers.some((u) => u.username.toLowerCase() === userFormData.username.trim().toLowerCase());
          if (exists) {
            showToast('El usuario ya existe', 'info');
            return;
          }
          const newUser = {
            id: `usr-${Date.now()}`,
            username: userFormData.username.trim(),
            password: userFormData.password,
            role: userFormData.role || 'Editor de Contenido'
          };
          updatedUsers = [...adminUsers, newUser];
        }

        setAdminUsers(updatedUsers);
        persistData('ngv_u', updatedUsers);
        setUserEditModal(null);
        setUserFormData({ username: '', password: '', role: 'Editor de Contenido' });
      };

      const handleDeleteUser = (userId) => {
        if (adminUsers.length <= 1) {
          showToast('No puedes eliminar el único administrador', 'info');
          return;
        }
        const updatedUsers = adminUsers.filter((u) => u.id !== userId);
        setAdminUsers(updatedUsers);
        persistData('ngv_u', updatedUsers);
      };

      const openEditor = (category, item = null) => {
        setEditorModal({ category, item });
        if (item) {
          setFormData({ ...item });
        } else {
          if (category === 'hero') setFormData({ title: '', category: 'Nueva Noticia', game: 'Juego', date: 'Hoy', image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80', tag: 'Update', description: '' });
          else if (category === 'updates') setFormData({ game: 'Juego', version: 'v1.0', title: 'Título', items: 'Cambios...' });
          else if (category === 'betas') setFormData({ title: 'Juego', type: 'Beta', description: '' });
          else if (category === 'characters') setFormData({ name: 'Nombre', game: 'Juego', avatar: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80', lore: '' });
          else if (category === 'bugs') setFormData({ game: 'Juego', bug: 'Bug', fix: 'Fix' });
          else if (category === 'curiosities') setFormData({ icon: '🎮', title: 'Título', game: 'Juego', detail: '' });
        }
      };

      const handleSaveForm = (e) => {
        e.preventDefault();
        const { category, item } = editorModal;
        const isEdit = Boolean(item && item.id);
        const newId = isEdit ? item.id : `${category}-${Date.now()}`;
        const payload = { ...formData, id: newId };

        if (category === 'hero') {
          const updated = isEdit ? heroData.map(i => i.id === newId ? payload : i) : [payload, ...heroData];
          setHeroData(updated);
          persistData('ngv_h', updated);
        } else if (category === 'updates') {
          const updated = isEdit ? updatesData.map(i => i.id === newId ? payload : i) : [payload, ...updatesData];
          setUpdatesData(updated);
          persistData('ngv_up', updated);
        } else if (category === 'betas') {
          const updated = isEdit ? betasData.map(i => i.id === newId ? payload : i) : [payload, ...betasData];
          setBetasData(updated);
          persistData('ngv_b', updated);
        } else if (category === 'characters') {
          const updated = isEdit ? charactersData.map(i => i.id === newId ? payload : i) : [payload, ...charactersData];
          setCharactersData(updated);
          persistData('ngv_c', updated);
        } else if (category === 'bugs') {
          const updated = isEdit ? bugsData.map(i => i.id === newId ? payload : i) : [payload, ...bugsData];
          setBugsData(updated);
          persistData('ngv_bg', updated);
        } else if (category === 'curiosities') {
          const updated = isEdit ? curiositiesData.map(i => i.id === newId ? payload : i) : [payload, ...curiositiesData];
          setCuriositiesData(updated);
          persistData('ngv_cu', updated);
        }

        setEditorModal(null);
      };

      const handleDeleteItem = (category, id) => {
        if (!isAdmin) return;
        if (category === 'hero') {
          const updated = heroData.filter(i => i.id !== id);
          setHeroData(updated);
          persistData('ngv_h', updated);
        } else if (category === 'updates') {
          const updated = updatesData.filter(i => i.id !== id);
          setUpdatesData(updated);
          persistData('ngv_up', updated);
        } else if (category === 'betas') {
          const updated = betasData.filter(i => i.id !== id);
          setBetasData(updated);
          persistData('ngv_b', updated);
        } else if (category === 'characters') {
          const updated = charactersData.filter(i => i.id !== id);
          setCharactersData(updated);
          persistData('ngv_c', updated);
        } else if (category === 'bugs') {
          const updated = bugsData.filter(i => i.id !== id);
          setBugsData(updated);
          persistData('ngv_bg', updated);
        } else if (category === 'curiosities') {
          const updated = curiositiesData.filter(i => i.id !== id);
          setCuriositiesData(updated);
          persistData('ngv_cu', updated);
        }
        showToast('Eliminado', 'info');
      };

      const getEmbedVideoUrl = (url) => {
        if (!url) return '';
        if (url.includes('embed/')) return url;
        let videoId = '';
        if (url.includes('youtube.com/watch?v=')) videoId = url.split('v=')[1]?.split('&')[0];
        else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
        return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
      };

      const filterBySearch = (items, fields) => {
        if (!searchQuery.trim()) return items;
        const q = searchQuery.toLowerCase();
        return items.filter((item) => fields.some((field) => String(item[field] || '').toLowerCase().includes(q)));
      };

      const filteredHero = filterBySearch(heroData, ['title', 'game', 'description', 'category']);
      const filteredUpdates = filterBySearch(updatesData, ['game', 'title', 'version', 'items']);
      const filteredBetas = filterBySearch(betasData, ['title', 'type', 'description']);
      const filteredCharacters = filterBySearch(charactersData, ['name', 'game', 'lore']);
      const filteredBugs = filterBySearch(bugsData, ['game', 'bug', 'fix']);
      const filteredCuriosities = filterBySearch(curiositiesData, ['title', 'game', 'detail']);

      const currentHero = filteredHero[heroIdx % Math.max(1, filteredHero.length)] || heroData[0];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans relative selection:bg-purple-600 selection:text-white pb-16">
          <BubbleCanvas />

          {toast && (
            <div className="fixed top-4 right-4 z-50 animate-bounce">

                <span>{toast.message}</span>
              </div>

          {isAdmin && (
            <div className="bg-gradient-to-r from-purple-900 via-indigo-900 to-purple-900 border-b border-purple-400/40 py-1.5 px-4 sticky top-0 z-50 text-xs flex items-center justify-between shadow-lg">
              <div className="flex items-center gap-2 text-purple-200">
                <Icon name="shield-check" className="w-4 h-4 text-emerald-400 animate-pulse" />
                <span className="font-bold text-white">Sesión Admin: <span className="text-purple-300 font-mono">{currentUser?.username || 'OsitoP3k'}</span></span>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={fetchCloudData} 
                  disabled={isSyncing}
                  className="flex items-center gap-1 bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1 rounded border border-emerald-400/50 text-[11px] font-bold cursor-pointer transition disabled:opacity-50"
                >
                  <Icon name="refresh-cw" className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`} /> 
                  {isSyncing ? 'Sincronizando...' : 'Sincronizar de la Nube'}
                </button>
                <button onClick={() => setShowUserMgmtModal(true)} className="flex items-center gap-1 bg-indigo-700 hover:bg-indigo-600 text-white px-2.5 py-1 rounded border border-indigo-400/50 text-[11px] font-bold">
                  <Icon name="users" className="w-3.5 h-3.5" /> Usuarios
                </button>
                <button onClick={() => setShowMediaSettingsModal(true)} className="flex items-center gap-1 bg-violet-700 hover:bg-violet-600 text-white px-2.5 py-1 rounded border border-violet-400/50 text-[11px] font-bold">
                  <Icon name="video" className="w-3 h-3" /> Video & Redes
                </button>
                <button onClick={() => { setIsAdmin(false); setCurrentUser(null); showToast('Sesión cerrada', 'info'); }} className="flex items-center gap-1 bg-red-900/80 hover:bg-red-800 text-red-100 px-2.5 py-1 rounded border border-red-400/40 text-[11px]">
                  <Icon name="log-out" className="w-3 h-3" /> Salir
                </button>
              </div>
            </div>
          )}

          <header className={`sticky ${isAdmin ? 'top-[33px]' : 'top-0'} z-40 bg-purple-950/90 backdrop-blur-md border-b border-purple-800/60 shadow-lg`}>
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 shrink-0">
                <div className="relative group cursor-pointer" onClick={() => setActiveTab('all')}>
                  <div className="p-2 bg-gradient-to-tr from-purple-700 to-violet-500 rounded-xl shadow-lg border border-purple-300/40 text-white">
                    <Icon name="gamepad-2" className="w-6 h-6 animate-pulse" />
                  </div>
                </div>
                <div>
                  <h1 className="text-lg font-black tracking-wider text-white">NewGame<span className="text-purple-400">Verse</span></h1>
                  <p className="text-[10px] text-purple-300 font-mono tracking-widest uppercase">Supabase Realtime</p>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-1 bg-purple-900/50 p-1 rounded-xl border border-purple-700/50">
                {[
                  { id: 'all', label: 'Inicio', icon: 'flame' },
                  { id: 'updates', label: 'Updates', icon: 'refresh-cw' },
                  { id: 'betas', label: 'Betas & Alphas', icon: 'radio' },
                  { id: 'characters', label: 'Personajes', icon: 'user-check' },
                  { id: 'bugs', label: 'Bugs & Patches', icon: 'bug' },
                  { id: 'curiosities', label: 'Curiosidades', icon: 'star' }
                ].map((tab) => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === tab.id ? 'bg-purple-600 text-white shadow-md border border-purple-300/40' : 'text-purple-200 hover:text-white hover:bg-purple-800/40'}`}>
                    <Icon name={tab.icon} className="w-3.5 h-3.5" />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                <div className="relative max-w-[180px] sm:max-w-xs w-full">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300 pointer-events-none" />
                  <input type="text" placeholder="Buscar juegos..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-purple-900/40 border border-purple-700/60 rounded-full pl-9 pr-8 py-1.5 text-xs text-white placeholder-purple-300/70 focus:outline-none focus:ring-2 focus:ring-purple-400" />
                </div>
                {!isAdmin && (
                  <button onClick={() => setShowLoginModal(true)} className="p-2 bg-purple-900/60 hover:bg-purple-800 text-purple-200 hover:text-white rounded-xl border border-purple-700/60 transition">
                    <Icon name="key" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8 space-y-10 relative z-10">
            {activeTab === 'all' && (
              <div className="space-y-10">
                {currentHero && (
                  <section className="relative rounded-2xl overflow-hidden shadow-2xl border border-purple-500/30 bg-purple-950/60 group">
                    <div className="relative h-80 sm:h-96 w-full overflow-hidden">
                      <img src={currentHero.image} className="w-full h-full object-cover group-hover:scale-105 transition duration-700" />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent" />
                      {isAdmin && (
                        <div className="absolute top-4 right-4 z-20 flex items-center gap-2">
                          <button onClick={() => openEditor('hero', currentHero)} className="p-2 bg-purple-900 text-white rounded-lg border border-purple-400"><Icon name="edit-3" className="w-4 h-4" /></button>
                          <button onClick={() => handleDeleteItem('hero', currentHero.id)} className="p-2 bg-red-900 text-white rounded-lg border border-red-400"><Icon name="trash-2" className="w-4 h-4" /></button>
                          <button onClick={() => openEditor('hero')} className="flex items-center gap-1 bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-lg border border-emerald-400"><Icon name="plus" className="w-4 h-4" /> Nueva Noticia</button>
                        </div>
                      )}
                      <div className="absolute bottom-6 left-6 right-6 space-y-3 z-10">
                        <span className="text-[11px] font-bold px-3 py-1 rounded-full bg-purple-600 text-white">{currentHero.tag}</span>
                        <h2 className="text-2xl sm:text-3xl font-black text-white">{currentHero.title}</h2>
                        <p className="text-xs sm:text-sm text-purple-100 max-w-xl line-clamp-2">{currentHero.description}</p>
                      </div>
                    </div>
                  </section>
                )}

                <section className="bg-purple-950/40 border border-purple-500/30 rounded-2xl p-6 shadow-2xl space-y-6">
                  <div className="flex justify-between items-center border-b border-purple-800/60 pb-4">
                    <h2 className="text-xl font-black text-white">{mediaSettings.videoTitle}</h2>
                    {isAdmin && <button onClick={() => setShowMediaSettingsModal(true)} className="bg-purple-800 text-white text-xs font-bold px-3 py-2 rounded-xl">Cambiar Video & Redes</button>}
                  </div>
                  <div className="relative w-full rounded-xl overflow-hidden aspect-video bg-slate-950">
                    <iframe src={getEmbedVideoUrl(mediaSettings.videoUrl)} className="w-full h-full border-0" allowFullScreen />
                  </div>
                </section>

                <section className="bg-gradient-to-r from-purple-950/80 via-slate-900/90 to-purple-950/80 border border-purple-500/40 rounded-2xl p-6 shadow-xl text-center space-y-6">
                  <div className="max-w-md mx-auto space-y-2">
                    <h3 className="text-xl font-black text-white flex items-center justify-center gap-2">
                      <Icon name="share-2" className="w-5 h-5 text-purple-400" />
                      Comunidad Oficial
                    </h3>
                    <p className="text-xs text-purple-200/80">Sigue nuestras redes sociales.</p>
                  </div>
                  <div className="flex flex-wrap items-center justify-center gap-4">
                    <a href={mediaSettings.discordUrl} target="_blank" className="flex items-center gap-3 bg-[#5865F2]/20 hover:bg-[#5865F2] text-white px-5 py-3 rounded-xl border border-[#5865F2]/50 shadow-lg transition">
                      <DiscordIcon className="w-6 h-6 text-[#5865F2]" /><span className="font-bold text-sm">Discord</span>
                    </a>
                    <a href={mediaSettings.instagramUrl} target="_blank" className="flex items-center gap-3 bg-gradient-to-r from-pink-500/20 to-purple-500/20 hover:from-pink-600 hover:to-purple-600 text-white px-5 py-3 rounded-xl border border-pink-500/50 shadow-lg transition">
                      <InstagramIcon className="w-6 h-6 text-pink-400" /><span className="font-bold text-sm">Instagram</span>
                    </a>
                    <a href={mediaSettings.tiktokUrl} target="_blank" className="flex items-center gap-3 bg-slate-800/80 hover:bg-black text-white px-5 py-3 rounded-xl border border-purple-400/40 shadow-lg transition">
                      <TikTokIcon className="w-6 h-6 text-teal-300" /><span className="font-bold text-sm">TikTok</span>
                    </a>
                  </div>
                </section>
              </div>
            )}

            {activeTab === 'characters' && (
              <section className="space-y-5">
                <div className="flex justify-between items-center border-b border-purple-800/50 pb-3">
                  <h2 className="text-lg font-black text-white">Personajes</h2>
                  {isAdmin && <button onClick={() => openEditor('characters')} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Agregar Personaje</button>}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  {filteredCharacters.map((char) => (
                    <div key={char.id} className="bg-white/95 text-slate-900 rounded-xl overflow-hidden shadow-lg relative group">
                      <div className="relative h-48"><img src={char.avatar} className="w-full h-full object-cover" />
                        {isAdmin && (
                          <div className="absolute top-3 right-3 flex gap-1 z-20">
                            <button onClick={() => openEditor('characters', char)} className="p-1.5 bg-purple-900 text-white rounded"><Icon name="edit-3" className="w-3.5 h-3.5" /></button>
                            <button onClick={() => handleDeleteItem('characters', char.id)} className="p-1.5 bg-red-900 text-white rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                          </div>
                        )}
                      </div>
                      <div className="p-4 space-y-2"><h3 className="text-lg font-black">{char.name}</h3><p className="text-xs text-slate-600">{char.lore}</p></div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === 'updates' && (
              <section className="space-y-5">
                <div className="flex justify-between items-center border-b border-purple-800/50 pb-3">
                  <h2 className="text-lg font-black text-white">Updates</h2>
                  {isAdmin && <button onClick={() => openEditor('updates')} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Agregar Update</button>}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {filteredUpdates.map((patch) => (
                    <div key={patch.id} className="bg-white/95 text-slate-900 p-5 rounded-xl space-y-2 relative">
                      {isAdmin && (
                        <div className="absolute top-4 right-4 flex gap-1">
                          <button onClick={() => openEditor('updates', patch)} className="p-1 bg-purple-200 text-purple-900 rounded"><Icon name="edit-3" className="w-3.5 h-3.5" /></button>
                          <button onClick={() => handleDeleteItem('updates', patch.id)} className="p-1 bg-red-200 text-red-900 rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                        </div>
                      )}
                      <span className="text-xs font-bold text-purple-800 font-mono">{patch.version}</span>
                      <h3 className="font-bold text-sm">{patch.title}</h3>
                      <p className="text-xs text-slate-600 whitespace-pre-line">{patch.items}</p>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === 'betas' && (
              <section className="space-y-5">
                <div className="flex justify-between items-center border-b border-purple-800/50 pb-3">
                  <h2 className="text-lg font-black text-white">Betas & Alphas</h2>
                  {isAdmin && <button onClick={() => openEditor('betas')} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Agregar Beta</button>}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  {filteredBetas.map((item) => (
                    <div key={item.id} className="bg-purple-950/50 border border-purple-500/40 p-5 rounded-xl space-y-2 relative">
                      {isAdmin && (
                        <div className="absolute top-4 right-4 flex gap-1">
                          <button onClick={() => openEditor('betas', item)} className="p-1 bg-purple-900 text-white rounded"><Icon name="edit-3" className="w-3.5 h-3.5" /></button>
                          <button onClick={() => handleDeleteItem('betas', item.id)} className="p-1 bg-red-900 text-white rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                        </div>
                      )}
                      <span className="text-xs text-purple-400 font-bold">{item.type}</span>
                      <h3 className="font-bold text-white">{item.title}</h3>
                      <p className="text-xs text-purple-200">{item.description}</p>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === 'bugs' && (
              <section className="space-y-5">
                <div className="flex justify-between items-center border-b border-purple-800/50 pb-3">
                  <h2 className="text-lg font-black text-white">Bugs & Patches</h2>
                  {isAdmin && <button onClick={() => openEditor('bugs')} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Agregar Bug</button>}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  {filteredBugs.map((b) => (
                    <div key={b.id} className="bg-purple-950/50 border border-purple-500/40 p-4 rounded-xl relative">
                      {isAdmin && (
                        <div className="absolute top-3 right-3 flex gap-1">
                          <button onClick={() => openEditor('bugs', b)} className="p-1 bg-purple-900 text-white rounded"><Icon name="edit-3" className="w-3.5 h-3.5" /></button>
                          <button onClick={() => handleDeleteItem('bugs', b.id)} className="p-1 bg-red-900 text-white rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                        </div>
                      )}
                      <h3 className="text-xs font-bold text-white">{b.bug}</h3>
                      <p className="text-xs text-purple-300 font-mono mt-2">Fix: {b.fix}</p>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === 'curiosities' && (
              <section className="space-y-5">
                <div className="flex justify-between items-center border-b border-purple-800/50 pb-3">
                  <h2 className="text-lg font-black text-white">Curiosidades</h2>
                  {isAdmin && <button onClick={() => openEditor('curiosities')} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Agregar</button>}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  {filteredCuriosities.map((c) => (
                    <div key={c.id} className="bg-white/95 text-slate-900 p-5 rounded-xl space-y-2 relative">
                      {isAdmin && (
                        <div className="absolute top-3 right-3 flex gap-1">
                          <button onClick={() => openEditor('curiosities', c)} className="p-1 bg-purple-200 text-purple-900 rounded"><Icon name="edit-3" className="w-3.5 h-3.5" /></button>
                          <button onClick={() => handleDeleteItem('curiosities', c.id)} className="p-1 bg-red-200 text-red-900 rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                        </div>
                      )}
                      <span className="text-xl">{c.icon}</span>
                      <h3 className="font-bold text-sm">{c.title}</h3>
                      <p className="text-xs text-slate-600">{c.detail}</p>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </main>

          {/* MODAL CONFIGURACIÓN VIDEO & REDES SOCIALES */}
          {showMediaSettingsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="bg-purple-950 border border-purple-400/60 rounded-2xl max-w-lg w-full p-6 space-y-4 relative">
                <button onClick={() => setShowMediaSettingsModal(false)} className="absolute top-4 right-4 text-purple-300"><Icon name="x" className="w-4 h-4" /></button>
                <h3 className="text-base font-black text-white">Configurar Video & Redes</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  persistData('ngv_m', mediaSettings);
                  setShowMediaSettingsModal(false);
                }} className="space-y-3 text-xs">
                  <div><label className="block text-purple-200 font-bold mb-1">Título del Video</label><input type="text" value={mediaSettings.videoTitle} onChange={(e) => setMediaSettings({...mediaSettings, videoTitle: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                  <div><label className="block text-purple-200 font-bold mb-1">URL YouTube Video</label><input type="text" value={mediaSettings.videoUrl} onChange={(e) => setMediaSettings({...mediaSettings, videoUrl: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                  <div><label className="block text-purple-200 font-bold mb-1">URL Discord</label><input type="text" value={mediaSettings.discordUrl} onChange={(e) => setMediaSettings({...mediaSettings, discordUrl: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                  <div><label className="block text-purple-200 font-bold mb-1">URL Instagram</label><input type="text" value={mediaSettings.instagramUrl} onChange={(e) => setMediaSettings({...mediaSettings, instagramUrl: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                  <div><label className="block text-purple-200 font-bold mb-1">URL TikTok</label><input type="text" value={mediaSettings.tiktokUrl} onChange={(e) => setMediaSettings({...mediaSettings, tiktokUrl: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                  <div className="flex justify-end gap-2 pt-2"><button type="submit" className="px-4 py-2 bg-purple-600 text-white font-bold rounded">Guardar Cambios</button></div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL GESTIÓN DE USUARIOS */}
          {showUserMgmtModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="bg-purple-950 border border-purple-400/60 rounded-2xl max-w-lg w-full p-6 space-y-4 relative">
                <button onClick={() => { setShowUserMgmtModal(false); setUserEditModal(null); }} className="absolute top-4 right-4 text-purple-300"><Icon name="x" className="w-4 h-4" /></button>
                <div className="flex justify-between items-center border-b border-purple-800 pb-3">
                  <h3 className="text-base font-black text-white">Gestión de Usuarios</h3>
                  <button onClick={() => { setUserEditModal('create'); setUserFormData({ username: '', password: '', role: 'Editor de Contenido' }); }} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Crear Usuario</button>
                </div>

                {userEditModal !== null && (
                  <form onSubmit={handleSaveUser} className="bg-slate-900 p-3 rounded-xl space-y-2 text-xs">
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" placeholder="Usuario" required value={userFormData.username} onChange={(e) => setUserFormData({...userFormData, username: e.target.value})} className="bg-purple-950 border border-purple-700 rounded p-2 text-white" />
                      <input type="password" placeholder="Contraseña" required value={userFormData.password} onChange={(e) => setUserFormData({...userFormData, password: e.target.value})} className="bg-purple-950 border border-purple-700 rounded p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-purple-200 font-bold mb-1">Rol / Permisos</label>
                      <select value={userFormData.role} onChange={(e) => setUserFormData({...userFormData, role: e.target.value})} className="w-full bg-purple-950 border border-purple-700 rounded p-2 text-white">
                        <option value="Super Administrador">Super Administrador</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Editor de Contenido">Editor de Contenido</option>
                      </select>
                    </div>
                    <div className="flex justify-end gap-2 pt-1"><button type="submit" className="px-3 py-1.5 bg-emerald-600 text-white font-bold rounded">Guardar Usuario</button></div>
                  </form>
                )}

                <div className="space-y-2 max-h-48 overflow-y-auto">
                  {adminUsers.map((usr) => (
                    <div key={usr.id} className="flex justify-between items-center p-2.5 bg-slate-900 rounded-xl border border-purple-800 text-xs">
                      <div><span className="font-bold text-white">{usr.username}</span> <span className="text-purple-300 font-mono">({usr.role})</span></div>
                      <button onClick={() => handleDeleteUser(usr.id)} className="p-1 bg-red-900 text-white rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL EDITOR GENERAL DE CONTENIDO */}
          {editorModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="bg-purple-950 border border-purple-400/60 rounded-2xl max-w-xl w-full p-6 space-y-4 relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => setEditorModal(null)} className="absolute top-4 right-4 text-purple-300"><Icon name="x" className="w-4 h-4" /></button>
                <h3 className="text-base font-black text-white capitalize">Editar ({editorModal.category})</h3>
                <form onSubmit={handleSaveForm} className="space-y-3 text-xs">
                  {editorModal.category === 'hero' && (
                    <>
                      <div><label className="block text-purple-200 font-bold mb-1">Título</label><input type="text" required value={formData.title || ''} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className="block text-purple-200 font-bold mb-1">Juego</label><input type="text" required value={formData.game || ''} onChange={(e) => setFormData({...formData, game: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                        <div><label className="block text-purple-200 font-bold mb-1">Etiqueta</label><input type="text" value={formData.tag || ''} onChange={(e) => setFormData({...formData, tag: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      </div>
                      <div><label className="block text-purple-200 font-bold mb-1">Imagen URL</label><input type="text" required value={formData.image || ''} onChange={(e) => setFormData({...formData, image: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Descripción</label><textarea rows={3} value={formData.description || ''} onChange={(e) => setFormData({...formData, description: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                    </>
                  )}
                  {editorModal.category === 'updates' && (
                    <>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className="block text-purple-200 font-bold mb-1">Juego</label><input type="text" required value={formData.game || ''} onChange={(e) => setFormData({...formData, game: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                        <div><label className="block text-purple-200 font-bold mb-1">Versión</label><input type="text" required value={formData.version || ''} onChange={(e) => setFormData({...formData, version: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                      </div>
                      <div><label className="block text-purple-200 font-bold mb-1">Título</label><input type="text" required value={formData.title || ''} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Notas</label><textarea rows={3} required value={formData.items || ''} onChange={(e) => setFormData({...formData, items: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                    </>
                  )}
                  {editorModal.category === 'betas' && (
                    <>
                      <div><label className="block text-purple-200 font-bold mb-1">Título</label><input type="text" required value={formData.title || ''} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Tipo</label><input type="text" value={formData.type || ''} onChange={(e) => setFormData({...formData, type: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Descripción</label><textarea rows={3} value={formData.description || ''} onChange={(e) => setFormData({...formData, description: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                    </>
                  )}
                  {editorModal.category === 'characters' && (
                    <>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className="block text-purple-200 font-bold mb-1">Nombre</label><input type="text" required value={formData.name || ''} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                        <div><label className="block text-purple-200 font-bold mb-1">Juego</label><input type="text" required value={formData.game || ''} onChange={(e) => setFormData({...formData, game: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      </div>
                      <div><label className="block text-purple-200 font-bold mb-1">Avatar URL</label><input type="text" required value={formData.avatar || ''} onChange={(e) => setFormData({...formData, avatar: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Lore</label><textarea rows={3} value={formData.lore || ''} onChange={(e) => setFormData({...formData, lore: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                    </>
                  )}
                  {editorModal.category === 'bugs' && (
                    <>
                      <div><label className="block text-purple-200 font-bold mb-1">Juego</label><input type="text" required value={formData.game || ''} onChange={(e) => setFormData({...formData, game: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Bug</label><input type="text" required value={formData.bug || ''} onChange={(e) => setFormData({...formData, bug: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Fix</label><textarea rows={3} value={formData.fix || ''} onChange={(e) => setFormData({...formData, fix: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white font-mono" /></div>
                    </>
                  )}
                  {editorModal.category === 'curiosities' && (
                    <>
                      <div className="grid grid-cols-3 gap-2">
                        <div><label className="block text-purple-200 font-bold mb-1">Icono</label><input type="text" value={formData.icon || ''} onChange={(e) => setFormData({...formData, icon: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white text-center text-lg" /></div>
                        <div className="col-span-2"><label className="block text-purple-200 font-bold mb-1">Juego</label><input type="text" required value={formData.game || ''} onChange={(e) => setFormData({...formData, game: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      </div>
                      <div><label className="block text-purple-200 font-bold mb-1">Título</label><input type="text" required value={formData.title || ''} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-purple-200 font-bold mb-1">Detalle</label><textarea rows={3} value={formData.detail || ''} onChange={(e) => setFormData({...formData, detail: e.target.value})} className="w-full bg-slate-900 border border-purple-700 rounded p-2 text-white" /></div>
                    </>
                  )}
                  <div className="flex justify-end gap-2 pt-3 border-t border-purple-800">
                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white font-bold rounded">Guardar en la Nube</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL LOGIN */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="bg-purple-950 border border-purple-400/60 rounded-2xl max-w-sm w-full p-6 space-y-4 relative">
                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-purple-300"><Icon name="x" className="w-4 h-4" /></button>
                <h3 className="text-lg font-black text-white text-center">Acceso Administrador</h3>
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input type="text" required value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} placeholder="Usuario" className="w-full bg-slate-900 border border-purple-700 rounded-xl px-3 py-2 text-xs text-white" />
                  <input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="Contraseña" className="w-full bg-slate-900 border border-purple-700 rounded-xl px-3 py-2 text-xs text-white font-mono" />
                  {authError && <p className="text-xs text-red-400">{authError}</p>}
                  <button type="submit" className="w-full py-2 bg-purple-600 text-white font-bold text-xs rounded-xl">Entrar</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
