    // --- CANVAS BACKGROUND ---
    const BubbleCanvas = ({ config }) => {
      const canvasRef = useRef(null);
      
      useEffect(() => {
        if (!config.showParticles) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, radius: 180 };
        const handleMouseMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
        window.addEventListener('mousemove', handleMouseMove);

        const numBubbles = Math.min(Math.floor(width / 20), 55);
        const bubbles = [];

        // Parse theme color to RGB for canvas
        const hexToRgb = (hex) => {
          const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '168, 85, 247';
        };
        const themeColorRGB = hexToRgb(config.primaryColor);

        class Bubble {
          constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.radius = Math.random() * 28 + 8;
            this.vx = (Math.random() - 0.5) * 0.7;
            this.vy = (Math.random() - 0.5) * 0.7;
            this.baseAlpha = Math.random() * 0.4 + 0.25;
            this.pulse = Math.random() * Math.PI * 2;
          }
          update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < -this.radius) this.x = width + this.radius;
            if (this.x > width + this.radius) this.x = -this.radius;
            if (this.y < -this.radius) this.y = height + this.radius;
            if (this.y > height + this.radius) this.y = -this.radius;
            const dx = mouse.x - this.x; const dy = mouse.y - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
              const force = (mouse.radius - distance) / mouse.radius;
              this.x -= (dx / distance) * force * 3;
              this.y -= (dy / distance) * force * 3;
            }
            this.pulse += 0.03;
          }
          draw() {
            ctx.beginPath();
            const currentRadius = Math.max(2, this.radius + Math.sin(this.pulse) * 2.5);
            const gradient = ctx.createRadialGradient(
              this.x - currentRadius * 0.3, this.y - currentRadius * 0.3, currentRadius * 0.1,
              this.x, this.y, currentRadius
            );
            gradient.addColorStop(0, `rgba(255, 255, 255, ${this.baseAlpha + 0.35})`);
            gradient.addColorStop(0.6, `rgba(${themeColorRGB}, ${this.baseAlpha})`);
            gradient.addColorStop(1, `rgba(${themeColorRGB}, 0)`);
            ctx.fillStyle = gradient;
            ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.baseAlpha * 0.6})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        for (let i = 0; i < numBubbles; i++) bubbles.push(new Bubble());

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          for (let i = 0; i < bubbles.length; i++) {
            for (let j = i + 1; j < bubbles.length; j++) {
              const dx = bubbles[i].x - bubbles[j].x;
              const dy = bubbles[i].y - bubbles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 120) {
                ctx.beginPath(); ctx.moveTo(bubbles[i].x, bubbles[i].y); ctx.lineTo(bubbles[j].x, bubbles[j].y);
                ctx.strokeStyle = `rgba(${themeColorRGB}, ${0.18 * (1 - dist / 120)})`;
                ctx.lineWidth = 1; ctx.stroke();
              }
            }
          }
          bubbles.forEach((b) => { b.update(); b.draw(); });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, [config.showParticles, config.primaryColor]);

      if (!config.showParticles) return null;
      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-80" />;
    };

    // --- DATOS INICIALES ---

    const INITIAL_HERO = [{ id: 'hero-1', title: 'Aetheria Legends: Actualización "Reino de Éter"', category: 'Súper Update', game: 'Aetheria Legends', date: 'Hace 1 hora', image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80', tag: 'Parche 4.0', description: 'Explora el nuevo continente flotante con físicas de gravedad variable y nuevos jefes de raid.' }];
    const INITIAL_BETAS = [{ id: 'ba-1', title: 'Valiant Realms: Rebirth', type: 'Beta Abierta', description: 'MMORPG de fantasía medieval.' }];
    const INITIAL_CHARACTERS = [{ id: 'c-1', name: 'Lyra Vance', game: 'Aetheria Legends', avatar: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80', lore: 'Capaz de alterar su densidad molecular.' }];
    const INITIAL_UPDATES = [{ id: 'u-1', game: 'Aetheria Legends', version: 'v4.0.2', title: 'Parche de Rebalanceo', items: 'Reducción de enfriamiento de habilidades.' }];
    const INITIAL_BUGS = [{ id: 'b-1', game: 'Vortex Protocol', bug: 'Vuelo Infinito', fix: 'Validación en servidor.' }];
    const INITIAL_CURIOSITIES = [{ id: 'cur-1', icon: '🎵', title: 'Canción Oculta', game: 'Cyber-Chrono 2088', detail: 'Versión retro en pausa.' }];
    const INITIAL_ADMIN_USERS = [{ id: 'usr-1', username: 'OsitoP3k', password: 'Emi1307', role: 'Super Administrador' }];

    function App() {
      const [activeTab, setActiveTab] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [heroIdx, setHeroIdx] = useState(0);

      const [isAdmin, setIsAdmin] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [isVisualEditorMode, setIsVisualEditorMode] = useState(false); // ESTADO MODO EDITOR

      // Modales
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showUserMgmtModal, setShowUserMgmtModal] = useState(false);
      const [showMediaSettingsModal, setShowMediaSettingsModal] = useState(false);
      
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [toast, setToast] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      // Data States
      const [themeConfig, setThemeConfig] = useState(INITIAL_THEME);
      const [adminUsers, setAdminUsers] = useState(INITIAL_ADMIN_USERS);
      const [mediaSettings, setMediaSettings] = useState(INITIAL_MEDIA_SETTINGS);
      const [heroData, setHeroData] = useState(INITIAL_HERO);
      const [updatesData, setUpdatesData] = useState(INITIAL_UPDATES);
      const [betasData, setBetasData] = useState(INITIAL_BETAS);
      const [charactersData, setCharactersData] = useState(INITIAL_CHARACTERS);
      const [bugsData, setBugsData] = useState(INITIAL_BUGS);
      const [curiositiesData, setCuriositiesData] = useState(INITIAL_CURIOSITIES);

      const [userEditModal, setUserEditModal] = useState(null);
      const [userFormData, setUserFormData] = useState({ username: '', password: '', role: 'Editor de Contenido' });
      const [editorModal, setEditorModal] = useState(null);
      const [formData, setFormData] = useState({});

      const fetchCloudData = async () => {
        setIsSyncing(true);
        try {
          const { data, error } = await supabaseClient.from('app_data').select('*');
          if (error) return;
          if (data && data.length > 0) {
            data.forEach(row => {
              let payload = row.payload;
              if (typeof payload === 'string') { try { payload = JSON.parse(payload); } catch(e) {} }
              if (row.key === 'ngv_theme' && payload) setThemeConfig(payload);
              if (row.key === 'ngv_u' && payload) setAdminUsers(payload);
              if (row.key === 'ngv_m' && payload) setMediaSettings(payload);
              if (row.key === 'ngv_h' && payload) setHeroData(payload);
              if (row.key === 'ngv_up' && payload) setUpdatesData(payload);
              if (row.key === 'ngv_b' && payload) setBetasData(payload);
              if (row.key === 'ngv_c' && payload) setCharactersData(payload);
              if (row.key === 'ngv_bg' && payload) setBugsData(payload);
              if (row.key === 'ngv_cu' && payload) setCuriositiesData(payload);
            });
            showToast('¡Datos sincronizados!');
          } else {
            await persistData('ngv_theme', INITIAL_THEME, false);
            await persistData('ngv_u', INITIAL_ADMIN_USERS, false);
            await persistData('ngv_m', INITIAL_MEDIA_SETTINGS, false);

            await persistData('ngv_up', INITIAL_UPDATES, false);
            await persistData('ngv_b', INITIAL_BETAS, false);
            await persistData('ngv_c', INITIAL_CHARACTERS, false);
            await persistData('ngv_bg', INITIAL_BUGS, false);
            await persistData('ngv_cu', INITIAL_CURIOSITIES, false);

        } catch (e) {
          console.error("Excepción:", e);
        } finally {

      };

      useEffect(() => { fetchCloudData(); }, []);

      // Aplicar estilos globales dinámicamente
      useEffect(() => {
        document.body.style.backgroundColor = themeConfig.bgColor;

      const persistData = async (key, payloadData, showNotification = true) => {
        try {
          await supabaseClient.from('app_data').upsert({ key: key, payload: payloadData, updated_at: new Date().toISOString() }, { onConflict: 'key' });

      const showToast = (message, type = 'success') => { setToast({ message, type }); setTimeout(() => setToast(null), 3000); };

      useEffect(() => {

        const timer = setInterval(() => { setHeroIdx((prev) => (prev + 1) % heroData.length); }, 6000);

      const handleAdminLogin = (e) => {

        const foundUser = adminUsers.find((u) => u.username.trim() === loginUsername.trim() && u.password === loginPassword);
        if (foundUser) {
          setIsAdmin(true); setCurrentUser(foundUser); setShowLoginModal(false); setLoginUsername(''); setLoginPassword(''); setAuthError('');

      };

      const isSuperAdmin = currentUser?.role === 'Super Administrador';

      // Handlers omitidos por brevedad (mantienen la lógica original exacta de borrado y edición)
      // [El código lógico de los formularios sigue intacto y funcionando abajo]
      const getEmbedVideoUrl = (url) => {
        if (!url) return '';
        if (url.includes('embed/')) return url;
        let videoId = '';
        if (url.includes('youtube.com/watch?v=')) videoId = url.split('v=')[1]?.split('&')[0];
        else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
        return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
      };

      const filterBySearch = (items, fields) => {
        if (!searchQuery.trim()) return items;
        const q = searchQuery.toLowerCase();
        return items.filter((item) => fields.some((field) => String(item[field] || '').toLowerCase().includes(q)));

      const filteredHero = filterBySearch(heroData, ['title', 'game', 'description', 'category']);
      const currentHero = filteredHero[heroIdx % Math.max(1, filteredHero.length)] || heroData[0];

      // MODO EDITOR VISUAL PANEL
      const handleThemeChange = (key, value) => {
        const newTheme = { ...themeConfig, [key]: value };
        setThemeConfig(newTheme);
      };
      
      const saveThemeToCloud = () => {
        persistData('ngv_theme', themeConfig);
        setIsVisualEditorMode(false);
      };

      return (
        <div className={`min-h-screen text-slate-100 relative pb-16 transition-all duration-300 ${isVisualEditorMode ? 'pr-80' : ''}`} style={{ fontFamily: themeConfig.fontFamily }}>
          <BubbleCanvas config={themeConfig} />

            <div className="fixed top-4 right-4 z-[9999] animate-bounce">
              <div className={`px-4 py-3 rounded-xl shadow-2xl border flex items-center gap-2 text-xs font-bold text-white ${ toast.type === 'info' ? 'bg-indigo-900 border-indigo-400' : 'bg-emerald-900 border-emerald-400' }`}>
                <Icon name="check-circle-2" className="w-4 h-4 text-emerald-400" /><span>{toast.message}</span>
              </div>

          )}

          {/* BARRA SUPERIOR DE ADMINISTRADOR */}
          {isAdmin && (
            <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border-b border-indigo-500/30 py-1.5 px-4 sticky top-0 z-[100] text-xs flex items-center justify-between shadow-lg">

              <div className="flex items-center gap-2">
                {isSuperAdmin && (
                  <button 
                    onClick={() => setIsVisualEditorMode(!isVisualEditorMode)} 
                    className={`flex items-center gap-1.5 px-3 py-1 rounded-md border text-[11px] font-bold transition-all ${isVisualEditorMode ? 'bg-pink-600 border-pink-400 text-white shadow-[0_0_10px_rgba(219,39,119,0.5)]' : 'bg-indigo-600 border-indigo-400 hover:bg-indigo-500 text-white'}`}
                  >
                    <Icon name="layout-template" className="w-3.5 h-3.5" />
                    {isVisualEditorMode ? 'Cerrar Constructor' : 'Modo Constructor Visual'}
                  </button>
                )}
                <button onClick={fetchCloudData} disabled={isSyncing} className="flex items-center gap-1 bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1 rounded border border-emerald-400/50 text-[11px] font-bold disabled:opacity-50">
                  <Icon name="refresh-cw" className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`} /> Sincronizar
                </button>
                <button onClick={() => { setIsAdmin(false); setCurrentUser(null); setIsVisualEditorMode(false); }} className="flex items-center gap-1 bg-red-900/80 hover:bg-red-800 text-red-100 px-2.5 py-1 rounded border border-red-400/40 text-[11px]">
                  <Icon name="log-out" className="w-3 h-3" /> Salir
                </button>
              </div>
            </div>
          )}

          {/* PANEL LATERAL DEL MODO EDITOR VISUAL (WIX/WEBFLOW STYLE) */}
          {isVisualEditorMode && isSuperAdmin && (
            <div className="fixed top-0 right-0 h-screen w-80 bg-slate-900/95 backdrop-blur-xl border-l border-slate-700 z-[90] shadow-2xl flex flex-col transform transition-transform overflow-y-auto">
              <div className="p-4 border-b border-slate-700 bg-slate-950 flex items-center justify-between sticky top-0 z-10">
                <div className="flex items-center gap-2">
                  <Icon name="brush" className="w-5 h-5 text-pink-500" />

                </div>
                <button onClick={() => setIsVisualEditorMode(false)} className="text-slate-400 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
              </div>
              
              <div className="p-5 space-y-6 flex-1">

                <div className="space-y-3">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-1">Colores Globales</h3>

                    <label className="text-[11px] font-bold text-slate-300 flex justify-between">Color Principal <span>{themeConfig.primaryColor}</span></label>

                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-300 flex justify-between">Fondo del Sitio <span>{themeConfig.bgColor}</span></label>

                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-300">Fondo de Cabecera (RGBA/Hex)</label>

                  </div>
                </div>

                {/* Tipografía y Geometría */}
                <div className="space-y-3">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-1">Apariencia</h3>
                  <div>
                    <label className="text-[11px] font-bold text-slate-300">Fuente Global</label>
                    <select value={themeConfig.fontFamily} onChange={(e) => handleThemeChange('fontFamily', e.target.value)} className="w-full mt-1 bg-slate-800 text-white text-xs p-2 rounded border border-slate-600">
                      <option value="sans-serif">Modern Sans (Defecto)</option>
                      <option value="monospace">Consolas / Monospace</option>
                      <option value="system-ui">System UI</option>
                      <option value="'Courier New', Courier, monospace">Retro Hacker</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-300">Redondeo de Tarjetas (Border Radius)</label>
                    <select value={themeConfig.borderRadius} onChange={(e) => handleThemeChange('borderRadius', e.target.value)} className="w-full mt-1 bg-slate-800 text-white text-xs p-2 rounded border border-slate-600">
                      <option value="0px">Cuadrado (0px)</option>
                      <option value="0.5rem">Suave (8px)</option>
                      <option value="1rem">Medio (16px)</option>
                      <option value="1.5rem">Muy Redondo (24px)</option>
                    </select>
                  </div>
                </div>

                {/* Branding e Identidad */}
                <div className="space-y-3">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-1">Identidad de Marca</h3>
                  <div>
                    <label className="text-[11px] font-bold text-slate-300">Nombre del Sitio</label>
                    <input type="text" value={themeConfig.siteName} onChange={(e) => handleThemeChange('siteName', e.target.value)} className="w-full mt-1 bg-slate-800 text-white text-xs p-2 rounded border border-slate-600" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-300">URL del Logo (Opcional, SVG/PNG)</label>
                    <input type="text" placeholder="https://..." value={themeConfig.siteLogo} onChange={(e) => handleThemeChange('siteLogo', e.target.value)} className="w-full mt-1 bg-slate-800 text-white text-xs p-2 rounded border border-slate-600" />
                  </div>
                  <label className="flex items-center gap-2 cursor-pointer mt-3">
                    <input type="checkbox" checked={themeConfig.showParticles} onChange={(e) => handleThemeChange('showParticles', e.target.checked)} className="w-4 h-4 accent-pink-500 rounded" />
                    <span className="text-xs font-bold text-slate-300">Mostrar Partículas Interactivas en Fondo</span>
                  </label>
                </div>
              </div>
              
              <div className="p-4 bg-slate-950 border-t border-slate-700">
                <button onClick={saveThemeToCloud} className="w-full py-2.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white text-xs font-black uppercase tracking-wider rounded-lg shadow-lg flex items-center justify-center gap-2 transition-transform active:scale-95">
                  <Icon name="save" className="w-4 h-4" /> Guardar Diseño en Nube
                </button>
              </div>
            </div>
          )}

          {/* HEADER PRINCIPAL (Aplicando variables del ThemeBuilder) */}
          <header className={`sticky ${isAdmin ? 'top-[33px]' : 'top-0'} z-40 backdrop-blur-md border-b border-white/10 shadow-lg`} style={{ backgroundColor: themeConfig.headerBg }}>
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 shrink-0">
                <div className="relative group cursor-pointer" onClick={() => setActiveTab('all')}>
                  {themeConfig.siteLogo ? (
                     <img src={themeConfig.siteLogo} alt="Logo" className="h-10 w-auto object-contain" />
                  ) : (
                    <div className="p-2 rounded-xl shadow-lg text-white" style={{ backgroundColor: themeConfig.primaryColor }}>
                      <Icon name="gamepad-2" className="w-6 h-6 animate-pulse" />
                    </div>
                  )}
                </div>
                <div>
                  <h1 className="text-lg font-black tracking-wider text-white">
                    {themeConfig.siteName.substring(0, themeConfig.siteName.length / 2)}
                    <span style={{ color: themeConfig.primaryColor }}>{themeConfig.siteName.substring(themeConfig.siteName.length / 2)}</span>
                  </h1>
                </div>
              </div>

              {/* MENÚ */}
              <nav className="hidden lg:flex items-center gap-1 bg-black/20 p-1 rounded-xl border border-white/5">
                {[{ id: 'all', label: 'Inicio', icon: 'flame' }, { id: 'updates', label: 'Updates', icon: 'refresh-cw' }].map((tab) => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === tab.id ? 'text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-white/10'}`} style={activeTab === tab.id ? { backgroundColor: themeConfig.primaryColor } : {}}>
                    <Icon name={tab.icon} className="w-3.5 h-3.5" /> <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                {!isAdmin && (
                  <button onClick={() => setShowLoginModal(true)} className="p-2 bg-black/30 hover:bg-black/50 text-slate-300 hover:text-white rounded-xl border border-white/10 transition">
                    <Icon name="key" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL (Aplicando variables de borderRadius y color) */}
          <main className="max-w-7xl mx-auto px-4 py-8 space-y-10 relative z-10">
            {activeTab === 'all' && (
              <div className="space-y-10">
                {currentHero && (
                  <section className={`relative overflow-hidden shadow-2xl border border-white/5 bg-black/40 group ${isVisualEditorMode ? 'ring-2 ring-pink-500 ring-offset-2 ring-offset-slate-900 cursor-crosshair' : ''}`} style={{ borderRadius: themeConfig.borderRadius }}>
                    <div className="relative h-80 sm:h-96 w-full overflow-hidden">
                      <img src={currentHero.image} className="w-full h-full object-cover group-hover:scale-105 transition duration-700" />
                      <div className="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent" />
                      <div className="absolute bottom-6 left-6 right-6 space-y-3 z-10">
                        <span className="text-[11px] font-bold px-3 py-1 text-white" style={{ backgroundColor: themeConfig.primaryColor, borderRadius: themeConfig.borderRadius }}>{currentHero.tag}</span>
                        <h2 className="text-2xl sm:text-3xl font-black text-white">{currentHero.title}</h2>
                        <p className="text-xs sm:text-sm text-slate-200 max-w-xl line-clamp-2">{currentHero.description}</p>
                      </div>
                    </div>
                  </section>
                )}

                <section className="bg-black/30 border border-white/10 p-6 shadow-2xl space-y-6" style={{ borderRadius: themeConfig.borderRadius }}>
                  <div className="flex justify-between items-center border-b border-white/10 pb-4">
                    <h2 className="text-xl font-black text-white">{mediaSettings.videoTitle}</h2>
                  </div>
                  <div className="relative w-full overflow-hidden aspect-video bg-black" style={{ borderRadius: themeConfig.borderRadius }}>
                    <iframe src={getEmbedVideoUrl(mediaSettings.videoUrl)} className="w-full h-full border-0" allowFullScreen />
                  </div>
                </section>
              </div>
            )}
          </main>

          {/* MODALES EXISTENTES SE MANTIENEN IGUAL (LOGIN, ETC) */}
          {showLoginModal && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-slate-900 border border-slate-700 p-6 space-y-4 relative shadow-2xl" style={{ borderRadius: themeConfig.borderRadius, maxWidth: '24rem', width: '100%' }}>
                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
                <h3 className="text-lg font-black text-white text-center">Acceso Administrador</h3>
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input type="text" required value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} placeholder="Usuario" className="w-full bg-black/50 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                  <input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="Contraseña" className="w-full bg-black/50 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono" />
                  {authError && <p className="text-xs text-red-400">{authError}</p>}
                  <button type="submit" className="w-full py-2 text-white font-bold text-xs shadow-lg" style={{ backgroundColor: themeConfig.primaryColor, borderRadius: themeConfig.borderRadius }}>Entrar al Sistema</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
