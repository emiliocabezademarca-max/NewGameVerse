    const BubbleCanvas = ({ config }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        if (!config.showParticles) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, radius: 180 };
        const handleMouseMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
        window.addEventListener('mousemove', handleMouseMove);

        const hexToRgb = (hex) => {
          const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '168, 85, 247';
        };
        const themeColorRGB = hexToRgb(config.primaryColor);
        const numBubbles = Math.min(Math.floor(width / 20), 40);
        const bubbles = Array.from({ length: numBubbles }, () => ({
          x: Math.random() * width, y: Math.random() * height,
          radius: Math.random() * 28 + 8, vx: (Math.random() - 0.5) * 0.7, vy: (Math.random() - 0.5) * 0.7,
          baseAlpha: Math.random() * 0.4 + 0.25, pulse: Math.random() * Math.PI * 2
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          for (let i = 0; i < bubbles.length; i++) {
            const b = bubbles[i];
            b.x += b.vx; b.y += b.vy;
            if (b.x < -b.radius) b.x = width + b.radius;
            if (b.x > width + b.radius) b.x = -b.radius;
            if (b.y < -b.radius) b.y = height + b.radius;
            if (b.y > height + b.radius) b.y = -b.radius;

            const dx = mouse.x - b.x; const dy = mouse.y - b.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
              const force = (mouse.radius - distance) / mouse.radius;
              b.x -= (dx / distance) * force * 3; b.y -= (dy / distance) * force * 3;
            }
            b.pulse += 0.03;

            for (let j = i + 1; j < bubbles.length; j++) {
              const dx2 = b.x - bubbles[j].x; const dy2 = b.y - bubbles[j].y;
              const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
              if (dist2 < 120) {
                ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(bubbles[j].x, bubbles[j].y);
                ctx.strokeStyle = `rgba(${themeColorRGB}, ${0.18 * (1 - dist2 / 120)})`;
                ctx.lineWidth = 1; ctx.stroke();
              }
            }

            ctx.beginPath();
            const currentRadius = Math.max(2, b.radius + Math.sin(b.pulse) * 2.5);
            const gradient = ctx.createRadialGradient(b.x - currentRadius * 0.3, b.y - currentRadius * 0.3, currentRadius * 0.1, b.x, b.y, currentRadius);
            gradient.addColorStop(0, `rgba(255, 255, 255, ${b.baseAlpha + 0.35})`);
            gradient.addColorStop(0.6, `rgba(${themeColorRGB}, ${b.baseAlpha})`);
            gradient.addColorStop(1, `rgba(${themeColorRGB}, 0)`);
            ctx.fillStyle = gradient; ctx.arc(b.x, b.y, currentRadius, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(b.x, b.y, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${b.baseAlpha * 0.6})`; ctx.lineWidth = 1; ctx.stroke();
          }
          animationFrameId = requestAnimationFrame(render);
        };
        render();
        return () => { window.removeEventListener('resize', handleResize); window.removeEventListener('mousemove', handleMouseMove); cancelAnimationFrame(animationFrameId); };
      }, [config.showParticles, config.primaryColor]);

      if (!config.showParticles) return null;
      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-80" />;
    };

    const INITIAL_MEDIA_SETTINGS = { videoTitle: 'Trailer Oficial de Temporada', videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0', discordUrl: 'https://discord.gg', instagramUrl: 'https://instagram.com', tiktokUrl: 'https://tiktok.com' };
    const INITIAL_HERO = [{ id: 'h-1', title: 'Aetheria Legends', category: 'Súper Update', game: 'Aetheria', date: 'Hace 1h', image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80', tag: 'Parche 4.0', description: 'Explora el nuevo continente flotante.' }];
    const INITIAL_BETAS = [{ id: 'b-1', title: 'Valiant Realms', type: 'Beta Abierta', description: 'MMORPG de fantasía.' }];
    const INITIAL_CHARACTERS = [{ id: 'c-1', name: 'Lyra Vance', game: 'Aetheria', avatar: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80', lore: 'Altera su densidad molecular.' }];
    const INITIAL_UPDATES = [{ id: 'u-1', game: 'Aetheria', version: 'v4.0.2', title: 'Rebalanceo', items: 'Reducción de enfriamiento.' }];
    const INITIAL_BUGS = [{ id: 'bg-1', game: 'Vortex Protocol', bug: 'Vuelo Infinito', fix: 'Validación en servidor.' }];
    const INITIAL_CURIOSITIES = [{ id: 'cu-1', icon: '🎵', title: 'Canción Oculta', game: 'Cyber-Chrono', detail: 'Versión retro en pausa.' }];
    const INITIAL_ADMIN_USERS = [{ id: 'usr-1', username: 'OsitoP3k', password: 'Emi1307', role: 'Super Administrador' }];

    function App() {
      const [activeTab, setActiveTab] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [heroIdx, setHeroIdx] = useState(0);
      const [isAdmin, setIsAdmin] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [isVisualEditorMode, setIsVisualEditorMode] = useState(false);
      const [editorSidebarTab, setEditorSidebarTab] = useState('diseño'); 

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showUserMgmtModal, setShowUserMgmtModal] = useState(false);
      const [showMediaSettingsModal, setShowMediaSettingsModal] = useState(false);
      
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [toast, setToast] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      const [themeConfig, setThemeConfig] = useState(INITIAL_THEME);
      const [adminUsers, setAdminUsers] = useState(INITIAL_ADMIN_USERS);
      const [mediaSettings, setMediaSettings] = useState(INITIAL_MEDIA_SETTINGS);
      const [heroData, setHeroData] = useState(INITIAL_HERO);
      const [updatesData, setUpdatesData] = useState(INITIAL_UPDATES);
      const [betasData, setBetasData] = useState(INITIAL_BETAS);
      const [charactersData, setCharactersData] = useState(INITIAL_CHARACTERS);
      const [bugsData, setBugsData] = useState(INITIAL_BUGS);
      const [curiositiesData, setCuriositiesData] = useState(INITIAL_CURIOSITIES);

      const [userEditModal, setUserEditModal] = useState(null);
      const [userFormData, setUserFormData] = useState({ username: '', password: '', role: 'Editor de Contenido' });
      const [editorModal, setEditorModal] = useState(null);
      const [formData, setFormData] = useState({});

      const fetchCloudData = async () => {
        setIsSyncing(true);
        try {
          const { data, error } = await supabaseClient.from('app_data').select('*');
          if (error) return;
          if (data && data.length > 0) {
            data.forEach(row => {
              let parsedPayload = row.payload;
              if (typeof parsedPayload === 'string') { try { parsedPayload = JSON.parse(parsedPayload); } catch(e) {} }
              if (row.key === 'ngv_theme' && parsedPayload) setThemeConfig({...INITIAL_THEME, ...parsedPayload}); 
              if (row.key === 'ngv_u' && parsedPayload) setAdminUsers(parsedPayload);
              if (row.key === 'ngv_m' && parsedPayload) setMediaSettings(parsedPayload);
              if (row.key === 'ngv_h' && parsedPayload) setHeroData(parsedPayload);
              if (row.key === 'ngv_up' && parsedPayload) setUpdatesData(parsedPayload);
              if (row.key === 'ngv_b' && parsedPayload) setBetasData(parsedPayload);
              if (row.key === 'ngv_c' && parsedPayload) setCharactersData(parsedPayload);
              if (row.key === 'ngv_bg' && parsedPayload) setBugsData(parsedPayload);
              if (row.key === 'ngv_cu' && parsedPayload) setCuriositiesData(parsedPayload);
            });
          }
        } catch (e) {} finally { setIsSyncing(false); }
      };

      // SUPABASE REALTIME SUSCRIPCIÓN
      useEffect(() => { 
        fetchCloudData(); 

        const realtimeChannel = supabaseClient
          .channel('public:app_data')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'app_data' }, (payload) => {
            console.log('Cambio detectado en Supabase, refrescando...');

          })
          .subscribe();

        return () => { supabaseClient.removeChannel(realtimeChannel); };

      }, [themeConfig]);

      const persistData = async (key, payloadData, showNotification = true) => {
        try {
          await supabaseClient.from('app_data').upsert({ key: key, payload: payloadData, updated_at: new Date().toISOString() }, { onConflict: 'key' });

      const showToast = (message, type = 'success') => { setToast({ message, type }); setTimeout(() => setToast(null), 3000); };

        if (!heroData || heroData.length === 0) return;

        return () => clearInterval(timer);
      }, [heroData]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const foundUser = adminUsers.find((u) => u.username.trim() === loginUsername.trim() && u.password === loginPassword);
        if (foundUser) {
          setIsAdmin(true); setCurrentUser(foundUser); setShowLoginModal(false); setLoginUsername(''); setLoginPassword(''); setAuthError('');
          showToast(`¡Bienvenido/a ${foundUser.username}!`);
        } else { setAuthError('Usuario incorrecto'); }
      };

      const isSuperAdmin = currentUser?.role === 'Super Administrador';
      const isEditor = currentUser?.role === 'Editor de Contenido';

      const handleThemeChange = (key, value) => { setThemeConfig(prev => ({ ...prev, [key]: value })); };
      const handleThemeTextChange = (textKey, newValue) => {
        const newTexts = { ...(themeConfig.texts || {}), [textKey]: newValue };
        handleThemeChange('texts', newTexts);
      };

      // DRAG & DROP
      const onDragStart = (e, index) => { e.dataTransfer.setData("text/plain", index.toString()); };
      const onDrop = (e, targetIndex) => {
        const sourceIndex = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if (isNaN(sourceIndex) || sourceIndex === targetIndex) return;
        const newOrder = [...(themeConfig.layoutOrder || ['hero', 'video', 'social'])];
        const [movedBlock] = newOrder.splice(sourceIndex, 1);
        newOrder.splice(targetIndex, 0, movedBlock);
        handleThemeChange('layoutOrder', newOrder);
      };

      const getCardClasses = () => {
        switch(themeConfig.cardStyle) {
          case 'solid': return 'bg-slate-900 border border-slate-700 shadow-xl';
          case 'minimal': return 'bg-transparent border border-white/20 shadow-none';
          case 'glass': default: return 'bg-black/30 backdrop-blur-md border border-white/10 shadow-2xl';
        }
      };
      const cardClass = getCardClasses();

      // BÚSQUEDA Y FILTRADO SEGURO
      function filterBySearch(items, fields) {
        if (!items) return [];
        if (!searchQuery.trim()) return items;
        return items.filter(item => fields.some(field => String(item[field] || '').toLowerCase().includes(searchQuery.toLowerCase())));
      }
      const filteredHero = filterBySearch(heroData || [], ['title', 'game', 'description']);
      const filteredUpdates = filterBySearch(updatesData || [], ['game', 'title', 'version', 'items']);

      const filteredBugs = filterBySearch(bugsData || [], ['game', 'bug', 'fix']);
      const filteredCuriosities = filterBySearch(curiositiesData || [], ['title', 'game', 'detail']);
      
      const currentHero = filteredHero[heroIdx % Math.max(1, filteredHero.length)] || (heroData && heroData[0]);

      // CRUD HANDLERS
      const openEditor = (category, item = null) => {
        setEditorModal({ category, item });
        if (item) setFormData({ ...item });
        else {
          if (category === 'hero') setFormData({ title: '', category: 'Noticia', game: 'Juego', date: 'Hoy', image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80', tag: 'Update', description: '' });
          else if (category === 'updates') setFormData({ game: 'Juego', version: 'v1.0', title: 'Título', items: 'Cambios...' });
          else if (category === 'betas') setFormData({ title: 'Juego', type: 'Beta', description: '' });
          else if (category === 'characters') setFormData({ name: 'Nombre', game: 'Juego', avatar: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80', lore: '' });
          else if (category === 'bugs') setFormData({ game: 'Juego', bug: 'Bug', fix: 'Fix' });
          else if (category === 'curiosities') setFormData({ icon: '🎮', title: 'Título', game: 'Juego', detail: '' });
        }
      };

      const handleSaveForm = (e) => {
        e.preventDefault();
        const { category, item } = editorModal;
        const newId = item && item.id ? item.id : `${category}-${Date.now()}`;
        const payload = { ...formData, id: newId };
        const updateState = (data, setData, key) => { const updated = item && item.id ? data.map(i => i.id === newId ? payload : i) : [payload, ...data]; setData(updated); persistData(key, updated); };

        if (category === 'hero') updateState(heroData, setHeroData, 'ngv_h');
        else if (category === 'updates') updateState(updatesData, setUpdatesData, 'ngv_up');
        else if (category === 'betas') updateState(betasData, setBetasData, 'ngv_b');
        else if (category === 'characters') updateState(charactersData, setCharactersData, 'ngv_c');
        else if (category === 'bugs') updateState(bugsData, setBugsData, 'ngv_bg');
        else if (category === 'curiosities') updateState(curiositiesData, setCuriositiesData, 'ngv_cu');
        setEditorModal(null);
      };

      const handleDeleteItem = (category, id) => {
        if (!isAdmin) return;
        const deleteState = (data, setData, key) => { const updated = data.filter(i => i.id !== id); setData(updated); persistData(key, updated); };
        if (category === 'hero') deleteState(heroData, setHeroData, 'ngv_h');
        else if (category === 'updates') deleteState(updatesData, setUpdatesData, 'ngv_up');
        else if (category === 'betas') deleteState(betasData, setBetasData, 'ngv_b');
        else if (category === 'characters') deleteState(charactersData, setCharactersData, 'ngv_c');
        else if (category === 'bugs') deleteState(bugsData, setBugsData, 'ngv_bg');
        else if (category === 'curiosities') deleteState(curiositiesData, setCuriositiesData, 'ngv_cu');
      };

      const handleSaveUser = (e) => {
        e.preventDefault();
        if (isEditor) return showToast('Sin permisos', 'info');
        let updatedUsers = userEditModal && userEditModal !== 'create' 
          ? adminUsers.map((u) => u.id === userEditModal.id ? { ...u, username: userFormData.username.trim(), password: userFormData.password, role: isSuperAdmin ? userFormData.role : u.role } : u)
          : [...adminUsers, { id: `usr-${Date.now()}`, username: userFormData.username.trim(), password: userFormData.password, role: isSuperAdmin ? userFormData.role : 'Editor de Contenido' }];
        setAdminUsers(updatedUsers); persistData('ngv_u', updatedUsers); setUserEditModal(null);
      };

      const handleDeleteUser = (targetUser) => {
        if (isEditor || targetUser.id === currentUser.id || adminUsers.length <= 1) return;
        const updatedUsers = adminUsers.filter((u) => u.id !== targetUser.id);
        setAdminUsers(updatedUsers); persistData('ngv_u', updatedUsers);
      };

      const getEmbedVideoUrl = (url) => {
        if (!url) return '';
        if (url.includes('embed/')) return url;
        let videoId = '';
        if (url.includes('youtube.com/watch?v=')) videoId = url.split('v=')[1]?.split('&')[0];
        else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
        return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
      };

      const renderHomeBlock = (blockId) => {
        if (blockId === 'hero' && currentHero) {
          return (
            <section key="hero" className={`relative overflow-hidden group transition-all duration-300 ${isVisualEditorMode ? 'ring-2 ring-pink-500 ring-offset-2 ring-offset-transparent' : ''} ${cardClass}`} style={{ borderRadius: themeConfig.borderRadius }}>
              <div className="relative h-80 sm:h-96 w-full overflow-hidden">
                <img src={currentHero.image} className="w-full h-full object-cover group-hover:scale-105 transition duration-700" />
                <div className="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent" />
                {isAdmin && (
                  <div className="absolute top-4 right-4 z-20 flex gap-2">
                    <button type="button" onClick={() => openEditor('hero', currentHero)} className="p-2 bg-black/80 text-white rounded-lg border border-white/20 hover:bg-black"><Icon name="edit-3" className="w-4 h-4" /></button>
                    <button type="button" onClick={() => handleDeleteItem('hero', currentHero.id)} className="p-2 bg-red-900 text-white rounded-lg border border-red-400 hover:bg-red-800"><Icon name="trash-2" className="w-4 h-4" /></button>
                    <button type="button" onClick={() => openEditor('hero')} className="flex items-center gap-1 bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-lg border border-emerald-400"><Icon name="plus" className="w-4 h-4" /> Noticia</button>
                  </div>
                )}
                <div className="absolute bottom-6 left-6 right-6 space-y-3 z-10">
                  <span className="text-[11px] font-bold px-3 py-1 text-white" style={{ backgroundColor: themeConfig.primaryColor, borderRadius: themeConfig.borderRadius }}>{currentHero.tag}</span>
                  <h2 className="text-2xl sm:text-3xl font-black text-white">{currentHero.title}</h2>
                  <p className="text-xs sm:text-sm text-slate-200 max-w-xl line-clamp-2">{currentHero.description}</p>
                </div>
              </div>
            </section>
          );
        }
        if (blockId === 'video') {
          return (
            <section key="video" className={`p-6 space-y-6 transition-all duration-300 ${isVisualEditorMode ? 'ring-2 ring-pink-500 ring-offset-2 ring-offset-transparent' : ''} ${cardClass}`} style={{ borderRadius: themeConfig.borderRadius }}>
              <div className="flex justify-between items-center border-b border-white/10 pb-4">
                <h2 className="text-xl font-black text-white">{mediaSettings.videoTitle}</h2>
                {isSuperAdmin && <button type="button" onClick={() => setShowMediaSettingsModal(true)} className="text-white text-xs font-bold px-3 py-2 transition" style={{ backgroundColor: themeConfig.primaryColor, borderRadius: themeConfig.borderRadius }}>Cambiar Video</button>}
              </div>
              <div className="relative w-full overflow-hidden aspect-video bg-black" style={{ borderRadius: themeConfig.borderRadius }}>
                <iframe src={getEmbedVideoUrl(mediaSettings.videoUrl)} className="w-full h-full border-0" allowFullScreen />
              </div>
            </section>
          );
        }
        if (blockId === 'social') {
          return (
            <section key="social" className={`p-6 text-center space-y-6 transition-all duration-300 ${isVisualEditorMode ? 'ring-2 ring-pink-500 ring-offset-2 ring-offset-transparent' : ''} ${cardClass}`} style={{ borderRadius: themeConfig.borderRadius }}>
              <div className="max-w-md mx-auto space-y-2">
                <EditableText as="h3" tKey="communityTitle" defaultText="Comunidad Oficial" className="text-xl font-black text-white flex items-center justify-center gap-2" isVisualEditorMode={isVisualEditorMode} themeConfig={themeConfig} onTextChange={handleThemeTextChange} />
                <EditableText as="p" tKey="communitySub" defaultText="Sigue nuestras redes sociales." className="text-xs text-slate-300" isVisualEditorMode={isVisualEditorMode} themeConfig={themeConfig} onTextChange={handleThemeTextChange} />
              </div>
              <div className="flex flex-wrap items-center justify-center gap-4">
                <a href={mediaSettings.discordUrl} target="_blank" className="flex items-center gap-3 bg-[#5865F2]/20 hover:bg-[#5865F2] text-white px-5 py-3 border border-[#5865F2]/50 shadow-lg transition" style={{ borderRadius: themeConfig.borderRadius }}><DiscordIcon className="w-6 h-6 text-[#5865F2]" /><span className="font-bold text-sm">Discord</span></a>
                <a href={mediaSettings.instagramUrl} target="_blank" className="flex items-center gap-3 bg-gradient-to-r from-pink-500/20 to-purple-500/20 hover:from-pink-600 hover:to-purple-600 text-white px-5 py-3 border border-pink-500/50 shadow-lg transition" style={{ borderRadius: themeConfig.borderRadius }}><InstagramIcon className="w-6 h-6 text-pink-400" /><span className="font-bold text-sm">Instagram</span></a>
                <a href={mediaSettings.tiktokUrl} target="_blank" className="flex items-center gap-3 bg-black/50 hover:bg-black text-white px-5 py-3 border border-white/20 shadow-lg transition" style={{ borderRadius: themeConfig.borderRadius }}><TikTokIcon className="w-6 h-6 text-teal-300" /><span className="font-bold text-sm">TikTok</span></a>
              </div>
            </section>
          );
        }
        return null;
      };

      return (
        <div className={`relative pb-16 transition-all duration-300 ${isVisualEditorMode ? 'pr-80' : ''}`}>
          <BubbleCanvas config={themeConfig} />

          {toast && (
            <div className="fixed top-4 right-4 z-[9999] animate-bounce">
              <div className={`px-4 py-3 rounded-xl shadow-2xl border flex items-center gap-2 text-xs font-bold text-white ${toast.type === 'info' ? 'bg-indigo-900 border-indigo-400' : 'bg-emerald-900 border-emerald-400'}`}>
                <Icon name="check-circle-2" className="w-4 h-4 text-emerald-400" /><span>{toast.message}</span>
              </div>
            </div>
          )}

          {isAdmin && (
            <div className="bg-slate-900/90 backdrop-blur border-b border-white/10 py-1.5 px-4 sticky top-0 z-[100] text-xs flex items-center justify-between shadow-lg">
              <div className="flex items-center gap-2 text-slate-300">
                <Icon name="shield-check" className="w-4 h-4 text-emerald-400 animate-pulse" />
                <span className="font-bold text-white">Sesión: <span className="font-mono" style={{ color: themeConfig.primaryColor }}>{currentUser?.username} ({currentUser?.role})</span></span>
              </div>
              <div className="flex items-center gap-2">
                {isSuperAdmin && (
                  <button type="button" onClick={() => setIsVisualEditorMode(!isVisualEditorMode)} className={`flex items-center gap-1.5 px-3 py-1 rounded-md border text-[11px] font-bold transition-all ${isVisualEditorMode ? 'bg-pink-600 border-pink-400 text-white shadow-[0_0_10px_rgba(219,39,119,0.5)]' : 'bg-indigo-600 border-indigo-400 hover:bg-indigo-500 text-white'}`}>
                    <Icon name={isVisualEditorMode ? 'x-circle' : 'layout-template'} className="w-3.5 h-3.5" />
                    {isVisualEditorMode ? 'Cerrar Motor Visual' : 'Motor Constructor Visual'}
                  </button>
                )}
                <button type="button" onClick={fetchCloudData} disabled={isSyncing} className="flex items-center gap-1 bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1 rounded border border-emerald-400/50 text-[11px] font-bold disabled:opacity-50">
                  <Icon name="refresh-cw" className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`} /> Sincronizar
                </button>
                <button type="button" onClick={() => setShowUserMgmtModal(true)} className="flex items-center gap-1 bg-indigo-700 hover:bg-indigo-600 text-white px-2.5 py-1 rounded border border-indigo-400/50 text-[11px] font-bold">
                  <Icon name="users" className="w-3.5 h-3.5" /> Usuarios
                </button>
                <button type="button" onClick={() => { setIsAdmin(false); setCurrentUser(null); setIsVisualEditorMode(false); }} className="flex items-center gap-1 bg-red-900/80 hover:bg-red-800 text-white px-2.5 py-1 rounded border border-red-400/40 text-[11px]">
                  <Icon name="log-out" className="w-3 h-3" /> Salir
                </button>
              </div>
            </div>
          )}

          {/* PANEL LATERAL DEL EDITOR VISUAL */}
          {isVisualEditorMode && isSuperAdmin && (
            <div className="fixed top-0 right-0 h-screen w-80 bg-slate-900/95 backdrop-blur-2xl border-l border-white/10 z-[90] shadow-2xl flex flex-col transform transition-transform">
              <div className="p-4 border-b border-white/10 bg-black/40 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Icon name="brush" className="w-5 h-5 text-pink-500" />
                  <h2 className="font-black text-white text-sm">Visual Engine V4</h2>
                </div>
                <button type="button" onClick={() => setIsVisualEditorMode(false)} className="text-slate-400 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
              </div>

              <div className="flex border-b border-white/10 bg-slate-900 text-[11px] font-bold">
                {['diseño', 'fondo', 'bloques'].map(tab => (
                  <button type="button" key={tab} onClick={() => setEditorSidebarTab(tab)} className={`flex-1 py-2 uppercase tracking-wider transition ${editorSidebarTab === tab ? 'text-pink-400 border-b-2 border-pink-500 bg-black/20' : 'text-slate-500 hover:text-slate-300'}`}>{tab}</button>
                ))}
              </div>
              
              <div className="p-5 space-y-6 flex-1 overflow-y-auto custom-scrollbar">
                {editorSidebarTab === 'diseño' && (
                  <div className="space-y-5">
                    <div className="space-y-3">
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-white/10 pb-1">Colores Globales</h3>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300 flex justify-between">Color Principal <span>{themeConfig.primaryColor}</span></label>
                        <div className="flex gap-2 mt-1">
                          <input type="color" value={themeConfig.primaryColor} onChange={(e) => handleThemeChange('primaryColor', e.target.value)} className="w-8 h-8 rounded cursor-pointer bg-transparent border-0 p-0" />
                          <input type="text" value={themeConfig.primaryColor} onChange={(e) => handleThemeChange('primaryColor', e.target.value)} className="flex-1 bg-black/40 text-white text-xs px-2 rounded border border-white/10 uppercase font-mono" />
                        </div>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300">Fondo Barra Cabecera (CSS)</label>
                        <input type="text" value={themeConfig.headerBg} onChange={(e) => handleThemeChange('headerBg', e.target.value)} className="w-full mt-1 bg-black/40 text-white text-xs p-2 rounded border border-white/10 font-mono" />
                      </div>
                    </div>

                    <div className="space-y-3">
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-white/10 pb-1">Geometría y Tipografía</h3>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300">Estilo de Cajas (Cards)</label>
                        <select value={themeConfig.cardStyle} onChange={(e) => handleThemeChange('cardStyle', e.target.value)} className="w-full mt-1 bg-black/40 text-white text-xs p-2 rounded border border-white/10">
                          <option value="glass">Glassmorphism (Cristal)</option>
                          <option value="solid">Sólido Oscuro (Clásico)</option>
                          <option value="minimal">Minimalista (Sin fondo)</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300">Redondeo Esquinas</label>
                        <select value={themeConfig.borderRadius} onChange={(e) => handleThemeChange('borderRadius', e.target.value)} className="w-full mt-1 bg-black/40 text-white text-xs p-2 rounded border border-white/10">
                          <option value="0px">Cuadrado (0px)</option>
                          <option value="0.5rem">Suave (8px)</option>
                          <option value="1rem">Medio (16px)</option>
                          <option value="1.5rem">Muy Redondo (24px)</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300">Tipografía Global</label>
                        <select value={themeConfig.fontFamily} onChange={(e) => handleThemeChange('fontFamily', e.target.value)} className="w-full mt-1 bg-black/40 text-white text-xs p-2 rounded border border-white/10">
                          <option value="sans-serif">Modern Sans</option>
                          <option value="monospace">Hacker / Monospace</option>
                          <option value="'Courier New', Courier, monospace">Retro</option>
                          <option value="system-ui">Sistema / Limpio</option>
                        </select>
                      </div>
                    </div>

                    <div className="space-y-3">
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-white/10 pb-1">Marca (Branding)</h3>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300 block mb-1">Nombre del Sitio (Logo Text)</label>
                        <input type="text" value={themeConfig.siteName} onChange={(e) => handleThemeChange('siteName', e.target.value)} className="w-full bg-black/40 text-white text-xs p-2 rounded border border-white/10" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-300">URL Logo Navbar (Opcional)</label>
                        <input type="text" placeholder="https://..." value={themeConfig.siteLogo} onChange={(e) => handleThemeChange('siteLogo', e.target.value)} className="w-full mt-1 bg-black/40 text-white text-xs p-2 rounded border border-white/10 font-mono" />
                      </div>
                    </div>
                  </div>
                )}

                {editorSidebarTab === 'fondo' && (
                  <div className="space-y-5">
                    <div>
                      <label className="text-[11px] font-bold text-slate-300 block mb-2">Tipo de Fondo Global</label>
                      <div className="flex bg-black/40 rounded-lg p-1 border border-white/10">
                        {['color', 'gradient', 'image'].map(type => (
                          <button type="button" key={type} onClick={() => handleThemeChange('bgType', type)} className={`flex-1 text-xs py-1.5 rounded transition capitalize ${themeConfig.bgType === type ? 'bg-pink-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}>{type}</button>
                        ))}
                      </div>
                    </div>

                    {themeConfig.bgType === 'color' && (
                      <div>
                        <label className="text-[11px] font-bold text-slate-300 flex justify-between">Color de Fondo <span>{themeConfig.bgColor}</span></label>
                        <div className="flex gap-2 mt-1">
                          <input type="color" value={themeConfig.bgColor} onChange={(e) => handleThemeChange('bgColor', e.target.value)} className="w-8 h-8 rounded cursor-pointer bg-transparent border-0 p-0" />
                          <input type="text" value={themeConfig.bgColor} onChange={(e) => handleThemeChange('bgColor', e.target.value)} className="flex-1 bg-black/40 text-white text-xs px-2 rounded border border-white/10 font-mono uppercase" />
                        </div>
                      </div>
                    )}

                    {themeConfig.bgType === 'image' && (
                      <div>
                        <label className="text-[11px] font-bold text-slate-300 block mb-1">URL de Imagen de Fondo</label>
                        <input type="text" placeholder="https://..." value={themeConfig.bgImage} onChange={(e) => handleThemeChange('bgImage', e.target.value)} className="w-full bg-black/40 text-white text-xs p-2 rounded border border-white/10 font-mono" />
                        <div className="mt-3 aspect-video w-full rounded border border-white/20 bg-cover bg-center" style={{ backgroundImage: `url(${themeConfig.bgImage || 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80'})`}}></div>
                      </div>
                    )}

                    <div className="pt-4 border-t border-white/10">
                      <label className="flex items-center gap-3 cursor-pointer p-3 bg-black/20 border border-white/10 rounded-lg hover:bg-black/40 transition">
                        <input type="checkbox" checked={themeConfig.showParticles} onChange={(e) => handleThemeChange('showParticles', e.target.checked)} className="w-4 h-4 accent-pink-500 rounded" />
                        <div className="flex flex-col">
                          <span className="text-xs font-bold text-white">Efecto Partículas Interactivas</span>
                          <span className="text-[10px] text-slate-400">Burbujas dinámicas que siguen el mouse</span>
                        </div>
                      </label>
                    </div>
                  </div>
                )}

                {editorSidebarTab === 'bloques' && (
                  <div className="space-y-4">
                    <p className="text-[11px] text-slate-400">Arrastra los bloques para reordenar tu página de inicio.</p>
                    <div className="space-y-2">
                      {(themeConfig.layoutOrder || ['hero', 'video', 'social']).map((blockId, index) => (
                        <div 
                          key={blockId} draggable="true" onDragStart={(e) => onDragStart(e, index)} onDrop={(e) => onDrop(e, index)} onDragOver={(e) => e.preventDefault()}
                          className="flex items-center justify-between p-3 bg-black/40 border border-white/10 rounded-lg cursor-grab hover:bg-pink-900/30 hover:border-pink-500 transition-colors"
                        >
                          <div className="flex items-center gap-2 pointer-events-none">
                            <Icon name="grip-vertical" className="w-4 h-4 text-slate-500" />
                            <span className="text-xs font-bold text-white capitalize">{blockId === 'hero' ? 'Banner Principal (Hero)' : blockId === 'video' ? 'Reproductor de Video' : 'Redes Sociales'}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
              
              <div className="p-4 bg-black border-t border-white/10 space-y-2">
                <div className="text-[10px] text-center text-slate-400 mb-2 font-bold animate-pulse">✨ Los cambios se sincronizan en tiempo real.</div>
                <button type="button" onClick={() => persistData('ngv_theme', themeConfig)} className="w-full py-2.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white text-xs font-black uppercase tracking-wider rounded-lg shadow-[0_0_15px_rgba(219,39,119,0.4)] flex items-center justify-center gap-2 transition-transform active:scale-95">
                  <Icon name="save" className="w-4 h-4" /> Publicar Diseño Visual
                </button>
              </div>
            </div>
          )}

          {/* HEADER PRINCIPAL */}
          <header className={`sticky ${isAdmin ? 'top-[33px]' : 'top-0'} z-40 backdrop-blur-md border-b border-white/10 shadow-lg`} style={{ backgroundColor: themeConfig.headerBg }}>
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 shrink-0">
                <div className="relative group cursor-pointer" onClick={() => setActiveTab('all')}>
                  {themeConfig.siteLogo ? (
                     <img src={themeConfig.siteLogo} alt="Logo" className="h-10 w-auto object-contain" />
                  ) : (
                    <div className="p-2 rounded-xl shadow-lg text-white transition-all" style={{ backgroundColor: themeConfig.primaryColor, borderRadius: themeConfig.borderRadius }}>
                      <Icon name="gamepad-2" className="w-6 h-6 animate-pulse" />
                    </div>
                  )}
                </div>
                <div>
                  <EditableText as="h1" tKey="siteName" defaultText={themeConfig.siteName} className="text-lg font-black tracking-wider text-white" isVisualEditorMode={isVisualEditorMode} themeConfig={themeConfig} onTextChange={handleThemeTextChange} />
                  <p className="text-[10px] font-mono tracking-widest uppercase" style={{ color: themeConfig.primaryColor }}>Supabase Realtime</p>
                </div>
              </div>

              <nav className="hidden lg:flex items-center gap-1 bg-black/30 p-1 border border-white/10" style={{ borderRadius: themeConfig.borderRadius }}>
                {[
                  { id: 'all', tKey: 'tabAll', def: 'Inicio', icon: 'flame' },
                  { id: 'updates', tKey: 'tabUpdates', def: 'Updates', icon: 'refresh-cw' },
                  { id: 'betas', tKey: 'tabBetas', def: 'Betas & Alphas', icon: 'radio' },
                  { id: 'characters', tKey: 'tabChars', def: 'Personajes', icon: 'user-check' },
                  { id: 'bugs', tKey: 'tabBugs', def: 'Bugs & Patches', icon: 'bug' },
                  { id: 'curiosities', tKey: 'tabCurio', def: 'Curiosidades', icon: 'star' }
                ].map((tab) => (
                  <button type="button" key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold transition ${activeTab === tab.id ? 'text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-white/10'}`} style={{ borderRadius: themeConfig.borderRadius, backgroundColor: activeTab === tab.id ? themeConfig.primaryColor : 'transparent' }}>
                    <Icon name={tab.icon} className="w-3.5 h-3.5" /> <EditableText tKey={tab.tKey} defaultText={tab.def} isVisualEditorMode={isVisualEditorMode} themeConfig={themeConfig} onTextChange={handleThemeTextChange} />
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                <div className="relative max-w-[150px] sm:max-w-xs w-full hidden sm:block">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                  <input type="text" placeholder={themeConfig.texts?.searchPlaceholder || 'Buscar juegos...'} value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-black/40 border border-white/10 pl-9 pr-3 py-1.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-1" style={{ borderRadius: themeConfig.borderRadius, borderBottomColor: themeConfig.primaryColor }} />
                </div>
                {!isAdmin && (
                  <button type="button" onClick={() => setShowLoginModal(true)} className="p-2 bg-black/40 hover:bg-black/60 text-slate-300 hover:text-white border border-white/10 transition" style={{ borderRadius: themeConfig.borderRadius }}><Icon name="key" className="w-4 h-4" /></button>
                )}
              </div>
            </div>
            
            <div className="lg:hidden bg-black/50 border-t border-white/10 px-2 py-2 flex items-center justify-between overflow-x-auto gap-1 no-scrollbar">
               {[ { id: 'all', tKey: 'tabAll', def: 'Inicio', icon: 'flame' }, { id: 'updates', tKey: 'tabUpdates', def: 'Updates', icon: 'refresh-cw' }, { id: 'betas', tKey: 'tabBetas', def: 'Betas', icon: 'radio' }, { id: 'characters', tKey: 'tabChars', def: 'Personajes', icon: 'user-check' }, { id: 'bugs', tKey: 'tabBugs', def: 'Bugs', icon: 'bug' }, { id: 'curiosities', tKey: 'tabCurio', def: 'Curiosidades', icon: 'star' }
                ].map((tab) => (
                  <button type="button" key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-1 px-3 py-1.5 text-[11px] font-bold shrink-0 transition ${activeTab === tab.id ? 'text-white shadow' : 'text-slate-400 hover:text-white hover:bg-white/10'}`} style={{ borderRadius: themeConfig.borderRadius, backgroundColor: activeTab === tab.id ? themeConfig.primaryColor : 'transparent' }}>
                    <Icon name={tab.icon} className="w-3 h-3" /> <EditableText tKey={tab.tKey} defaultText={tab.def} isVisualEditorMode={isVisualEditorMode} themeConfig={themeConfig} onTextChange={handleThemeTextChange} />
                  </button>
                ))}
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8 space-y-10 relative z-10">
            {activeTab === 'all' && (
              <div className="space-y-10">
                {(themeConfig.layoutOrder || ['hero', 'video', 'social']).map(block => renderHomeBlock(block))}
              </div>
            )}

            {activeTab === 'characters' && (
              <section className="space-y-5">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <EditableText as="h2" tKey="tabChars" defaultText="Personajes" className="text-lg font-black text-white" isVisualEditorMode={isVisualEditorMode} themeConfig={themeConfig} onTextChange={handleThemeTextChange} />

                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input type="text" required value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} placeholder="Usuario" className="w-full bg-black/50 border border-slate-700 px-3 py-2 text-xs text-white focus:outline-none focus:border-slate-500" style={{ borderRadius: themeConfig.borderRadius }} />
                  <input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="Contraseña" className="w-full bg-black/50 border border-slate-700 px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-slate-500" style={{ borderRadius: themeConfig.borderRadius }} />
                  {authError && <p className="text-xs text-red-400">{authError}</p>}
                  <button type="submit" className="w-full py-2 text-white font-bold text-xs shadow-lg transition" style={{ backgroundColor: themeConfig.primaryColor, borderRadius: themeConfig.borderRadius }}>Entrar</button>
                </form>
              </div>
            </div>
          )}

          <style>{`
            .custom-scrollbar::-webkit-scrollbar { width: 4px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
          `}</style>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
